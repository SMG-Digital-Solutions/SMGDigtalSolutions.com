[build]
  base = "app"
  publish = "dist"
  command = "npm run build"

# GA4 Measurement IDs and Meta Pixel IDs aren't secret — they're embedded
# in public client-side JS on every page by design — so they're kept here
# rather than only in Netlify's dashboard, which would be a second,
# easy-to-miss place to update.
[build.environment]
  PUBLIC_GA_MEASUREMENT_ID = "G-11S4R4KSDV"
  PUBLIC_META_PIXEL_ID = "2006679344053778"

# Proxies /admin/* to the separate admin app (its own Netlify site + Next.js
# + Prisma/Neon, kept out of this repo — see smg-admin/README.md). This is a
# rewrite (status = 200), not a redirect, so the visitor's URL bar always
# stays on smgdigitalsolutions.com — the split between this static site and
# the admin app is invisible to them. Must come before the catch-all rule
# below (Netlify uses the first matching rule).
[[redirects]]
  from = "/admin"
  to = "https://smgdigitalsolutionsadmin.netlify.app/admin"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://smgdigitalsolutionsadmin.netlify.app/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
