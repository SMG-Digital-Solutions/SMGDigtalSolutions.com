[build]
  base = "app"
  publish = "dist"
  command = "npm run build"

# GA4 Measurement IDs and Meta Pixel IDs aren't secret — they're embedded
# in public client-side JS on every page by design — so they're kept here
# rather than only in Netlify's dashboard, which would be a second,
# easy-to-miss place to update.
[build.environment]
  PUBLIC_GA_MEASUREMENT_ID = "G-11S4R4KSDV"
  PUBLIC_META_PIXEL_ID = "2006679344053778"

# /admin/* used to be proxied to the separate admin app via a plain
# `[[redirects]]` external-URL rewrite here. That rewrite consistently
# 500'd for every /admin/* path — confirmed (via the admin app's own
# function logs) that the request never even arrived there, a
# Netlify-to-Netlify proxying failure specific to the built-in redirect
# mechanism. It's now handled by netlify/edge-functions/admin-proxy.ts
# instead, which does the fetch itself — see that file for the full story.
# Edge functions run before redirects, so no rule is needed here at all.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
